name: Stage 5 widget simulator
on:
  push:
    branches: [ci/ios-widget-stage5, ci/ios-reminders-stage6, ci/ios-ui-stage7]
permissions:
  contents: read
jobs:
  widgets:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate model and content
        run: |
          swift test
          python3 Scripts/validate_content.py
      - name: Prepare simulator and UI tests
        run: |
          set -eu
          mkdir -p evidence
          xcodebuild -version | tee evidence/xcode.txt
          xcrun simctl list devices available -j > evidence/devices.json
          device=$(python3 -c 'import json; d=json.load(open("evidence/devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,reverse=True) if k.endswith(".iOS-18-5") for v in d[k] if v["name"] == "iPhone 16"))')
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          gem list -i xcodeproj || gem install xcodeproj --user-install --no-document
          ruby Scripts/stage5/prepare.rb
      - name: Exercise installed widget on Home Screen
        run: |
          xcrun simctl io "$DEVICE" screenshot evidence/booted.png
          xcrun simctl io "$DEVICE" recordVideo evidence/widget.mp4 &
          recorder=$!
          trap 'xcrun simctl io "$DEVICE" screenshot evidence/last-screen.png || true; kill -INT "$recorder" 2>/dev/null || true; wait "$recorder" || true' EXIT
          set -o pipefail
          xcodebuild test -project MyCompanion.xcodeproj -scheme Stage5 -destination "platform=iOS Simulator,id=$DEVICE" ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -resultBundlePath evidence/Widget.xcresult 2>&1 | tee evidence/xcodebuild.log
      - name: Capture simulator Lock Screen
        if: always() && env.DEVICE != ''
        run: |
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          osascript -e 'tell application "Simulator" to activate'
          sleep 2
          osascript -e 'tell application "System Events" to keystroke "l" using command down'
          sleep 2
          window=$(swift - <<'SWIFT'
          import CoreGraphics
          import Foundation
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in windows {
              guard window[kCGWindowOwnerName as String] as? String == "Simulator",
                    window[kCGWindowLayer as String] as? Int == 0,
                    let id = window[kCGWindowNumber as String] as? Int,
                    let bounds = window[kCGWindowBounds as String] as? [String: CGFloat],
                    let x = bounds["X"], let y = bounds["Y"],
                    let w = bounds["Width"], let h = bounds["Height"], h > w, w > 150 else { continue }
              let point = CGPoint(x: x + w / 2, y: y + h * 0.67)
              for kind: CGEventType in [.mouseMoved, .leftMouseDown, .leftMouseUp] {
                  CGEvent(mouseEventSource: nil, mouseType: kind, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
                  Thread.sleep(forTimeInterval: 0.1)
              }
              print(id)
              exit(0)
          }
          fputs("Simulator device window not found\n", stderr)
          exit(1)
          SWIFT
          )
          sleep 2
          result=0
          xcrun simctl io "$DEVICE" screenshot evidence/lock-screen.png || result=1
          screencapture -x -o -l "$window" evidence/lock-screen-window.png || result=1
          exit "$result"
      - name: Export UI screenshots
        if: always() && hashFiles('evidence/Widget.xcresult/Info.plist') != ''
        run: xcrun xcresulttool export attachments --path evidence/Widget.xcresult --output-path evidence/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-simulator-evidence
          path: evidence/
          retention-days: 7
