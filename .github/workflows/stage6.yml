name: Stage 6 local reminders
on:
  workflow_dispatch:
  push:
    paths-ignore: ['Scripts/stage5/WidgetUITests.swift']
    branches: [ci/ios-reminders-stage6, ci/ios-ui-stage7, codex/ios-simulator-validation]
permissions:
  contents: read
jobs:
  reminders:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: [testDenied, testScheduleReplaceCancel, testCreateAndCompleteTask, testCalendarPrivacy, testStageSevenNavigation]
        profile: [baseline]
        include:
          - test: testStageSevenNavigation
            profile: oldest-compact
          - test: testStageSevenNavigation
            profile: latest-large
    steps:
      - uses: actions/checkout@v4
      - name: Validate core and content
        if: matrix.test == 'testScheduleReplaceCancel'
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-tests.log
          python3 Scripts/validate_content.py
      - name: Prepare fresh iPhone
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          gem list -i xcodeproj || gem install xcodeproj --user-install --no-document
          ruby Scripts/stage5/prepare.rb reminders
          mkdir -p evidence
          xcodebuild -version > evidence/xcode.txt
          xcrun simctl list devices available -j > evidence/devices.json
          uname -s > evidence/host.txt
          sw_vers >> evidence/host.txt
          xcrun simctl list devicetypes -j > evidence/device-types.json
          xcodebuild -showsdks > evidence/sdks.txt
          xcrun simctl list runtimes -j > evidence/runtimes.json
          device=$(python3 Scripts/select_simulator.py evidence/devices.json evidence/destination.json --profile "$PROFILE")
          cat evidence/destination.json
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          if ! python3 -c 'import json, sys; sys.exit(json.load(open("evidence/destination.json"))["state"] != "Booted")'; then
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project MyCompanion.xcodeproj -scheme Reminders -showdestinations > evidence/destinations.txt
      - name: Check notification permission and system queue
        env:
          TEST: ${{ matrix.test }}
        run: |
          set -o pipefail
          xcodebuild test -project MyCompanion.xcodeproj -scheme Reminders -destination "platform=iOS Simulator,id=$DEVICE" ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -only-testing:"WidgetUITests/ReminderUITests/$TEST" -resultBundlePath Reminder.xcresult 2>&1 | tee xcodebuild.log
      - name: Verify records held by EventKit or Notification Center
        if: matrix.test == 'testCalendarPrivacy' || matrix.test == 'testScheduleReplaceCancel' || matrix.test == 'testCreateAndCompleteTask'
        env:
          CASE: ${{ matrix.test == 'testCalendarPrivacy' && 'testSnapshotPrivacyAndWithdrawal' || matrix.test == 'testCreateAndCompleteTask' && 'testRepeatedIntentCannotSnoozeOrCompleteANewerRevision' || 'testSystemDeliveredReminder' }}
        run: |
          set -o pipefail
          xcodebuild test -project MyCompanion.xcodeproj -scheme Reminders -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:"WidgetProviderTests/CalendarIntegrationTests/$CASE" -resultBundlePath Calendar.xcresult 2>&1 | tee calendar-test.log
      - name: Export screenshots
        if: always() && hashFiles('Reminder.xcresult/Info.plist') != ''
        run: xcrun xcresulttool export attachments --path Reminder.xcresult --output-path screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-${{ matrix.test }}-${{ matrix.profile }}
          path: |
            evidence/
            Calendar.xcresult
            core-tests.log
            calendar-test.log
            Reminder.xcresult
            screens
            xcodebuild.log
          retention-days: 7
