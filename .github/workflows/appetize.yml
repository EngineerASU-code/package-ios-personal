name: Appetize iPhone simulator build
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-simulator-validation]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check content and core logic
        run: |
          python3 Scripts/validate_content.py
          swift test
      - name: Build for the ARM iOS Simulator
        run: |
          xcodebuild build -project MyCompanion.xcodeproj -scheme MyCompanion \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64
      - name: Package the app and its widget
        run: |
          app=build/Build/Products/Debug-iphonesimulator/MyCompanion.app
          test -d "$app/PlugIns/CompanionWidget.appex"
          lipo "$app/MyCompanion" -verify_arch arm64
          ditto -c -k --keepParent "$app" MyCompanion-Appetize.zip
          unzip -tq MyCompanion-Appetize.zip
      - name: Check eligibility to share the simulator package
        id: package-rights
        if: github.event.repository.private == false
        run: |
          app=build/Build/Products/Debug-iphonesimulator/MyCompanion.app
          if python3 Scripts/check_release_rights.py "$app/Characters" && python3 Scripts/check_release_rights.py "$app/PlugIns/CompanionWidget.appex/Characters"; then
            echo 'cleared=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Simulator package passed packaging checks. Public download awaits asset clearance.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private || steps.package-rights.outputs.cleared == 'true'
        with:
          name: MyCompanion-Appetize
          path: MyCompanion-Appetize.zip
          if-no-files-found: error
          retention-days: 7
